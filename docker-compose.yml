version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database Cluster
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: appraisal-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Auth & User Management Service (Port 9001)
  # ---------------------------------------------------------------------------
  auth-user-service:
    build:
      context: .
      dockerfile: auth-user-service/Dockerfile
    container_name: appraisal-auth-user-service
    restart: always
    environment:
      SERVER_PORT: 9001
      DATABASE_URL: jdbc:postgresql://postgres:5432/appraisal_auth_user_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-SecretKeyForJWTAppraisalMustBeAtLeast256BitsLongForHMACSHA256}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-appraisal@dypiu.ac.in}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-your_app_password}
      MAIL_FROM: ${MAIL_FROM:-noreply@dypiu.edu.in}
    ports:
      - "${AUTH_SERVICE_PORT:-9001}:9001"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 3. Form Section Data Service (Port 9002)
  # ---------------------------------------------------------------------------
  form-data-service:
    build:
      context: .
      dockerfile: form-data-service/Dockerfile
    container_name: appraisal-form-data-service
    restart: always
    environment:
      SERVER_PORT: 9002
      DATABASE_URL: jdbc:postgresql://postgres:5432/appraisal_forms_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${FORMS_SERVICE_PORT:-9002}:9002"
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 4. Submission & Workflow Service (Port 9003)
  # ---------------------------------------------------------------------------
  submission-service:
    build:
      context: .
      dockerfile: submission-service/Dockerfile
    container_name: appraisal-submission-service
    restart: always
    environment:
      SERVER_PORT: 9003
      DATABASE_URL: jdbc:postgresql://postgres:5432/appraisal_submission_db
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      AUTH_SERVICE_URL: http://auth-user-service:9001
      FORMS_SERVICE_URL: http://form-data-service:9002
    ports:
      - "${SUBMISSION_SERVICE_PORT:-9003}:9003"
    depends_on:
      postgres:
        condition: service_healthy
      auth-user-service:
        condition: service_started
      form-data-service:
        condition: service_started

  # ---------------------------------------------------------------------------
  # 5. Attachment & Storage Service (Port 9004)
  # ---------------------------------------------------------------------------
  storage-service:
    build:
      context: .
      dockerfile: storage-service/Dockerfile
    container_name: appraisal-storage-service
    restart: always
    environment:
      SERVER_PORT: 9004
      UPLOAD_LOCAL_PATH: ${UPLOAD_DIR:-/app/uploads}
    ports:
      - "${STORAGE_SERVICE_PORT:-9004}:9004"
    volumes:
      - uploads_data:${UPLOAD_DIR:-/app/uploads}

  # ---------------------------------------------------------------------------
  # 6. System Backup & Admin Service (Port 9005)
  # ---------------------------------------------------------------------------
  admin-service:
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    container_name: appraisal-admin-service
    restart: always
    environment:
      SERVER_PORT: 9005
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      BACKUP_DIR: ${BACKUP_DIR:-/app/backups}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${ADMIN_SERVICE_PORT:-9005}:9005"
    volumes:
      - uploads_data:${UPLOAD_DIR:-/app/uploads}
      - backups_data:${BACKUP_DIR:-/app/backups}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 7. API Gateway Entrypoint (Port 9000)
  # ---------------------------------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: appraisal-api-gateway
    restart: always
    environment:
      SERVER_PORT: 9000
      AUTH_SERVICE_URL: http://auth-user-service:9001
      FORMS_SERVICE_URL: http://form-data-service:9002
      SUBMISSION_SERVICE_URL: http://submission-service:9003
      STORAGE_SERVICE_URL: http://storage-service:9004
      ADMIN_SERVICE_URL: http://admin-service:9005
      JWT_SECRET: ${JWT_SECRET:-SecretKeyForJWTAppraisalMustBeAtLeast256BitsLongForHMACSHA256}
    ports:
      - "${GATEWAY_PORT:-9000}:9000"
    depends_on:
      - auth-user-service
      - form-data-service
      - submission-service
      - storage-service
      - admin-service

volumes:
  pgdata:
  uploads_data:
  backups_data:

