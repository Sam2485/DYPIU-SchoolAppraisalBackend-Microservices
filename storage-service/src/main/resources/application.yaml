server:
  port: ${PORT:${SERVER_PORT:9004}}


spring:
  application:
    name: storage-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 25MB
      max-request-size: 50MB

app:
  upload:
    local-path: ${UPLOAD_LOCAL_PATH:./uploads}
  gcp:
    bucket-name: ${GCP_BUCKET_NAME:schoolappraisal-attachments}