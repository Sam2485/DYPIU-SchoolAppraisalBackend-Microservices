server:
  port: ${PORT:${SERVER_PORT:9003}}

spring:
  application:
    name: submission-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/appraisal_submission_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    locations: classpath:db/migration


AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:http://localhost:9001}
FORMS_SERVICE_URL: ${FORMS_SERVICE_URL:http://localhost:9002}