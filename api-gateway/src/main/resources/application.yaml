server:
  port: ${PORT:${SERVER_PORT:9000}}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Expose-Headers, RETAIN_FIRST
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            exposedHeaders:
              - Authorization
              - Content-Type
              - X-Correlation-Id
              - X-Request-Id
            allowCredentials: true


      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:9001}
          predicates:
            - Path=/api/auth/**, /api/users/**

        - id: form-data-service
          uri: ${FORMS_SERVICE_URL:http://localhost:9002}
          predicates:
            - Path=/api/academic/**, /api/administrative/**, /api/config/**, /api/admin/config/**, /api/universities/**


        - id: submission-service
          uri: ${SUBMISSION_SERVICE_URL:http://localhost:9003}
          predicates:
            - Path=/api/submissions/**, /api/audit-cycles/**

        - id: storage-service
          uri: ${STORAGE_SERVICE_URL:http://localhost:9004}
          predicates:
            - Path=/api/attachments/**, /uploads/**

        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:http://localhost:9005}
          predicates:
            - Path=/api/backup/**

app:
  jwt:
    secret: ${JWT_SECRET:${JWT_SECRET_KEY:a7f997cb3734907e6ce00508c77996e02d5b81215f9993d061198404fa41a343}}