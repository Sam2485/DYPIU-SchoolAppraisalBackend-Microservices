server:
  port: ${PORT:${SERVER_PORT:9001}}

spring:
  application:
    name: auth-user-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/appraisal_auth_user_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:your-email@gmail.com}
    password: ${SMTP_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  upload:
    local-path: ${UPLOAD_LOCAL_PATH:./uploads}
  jwt:
    secret: ${JWT_SECRET:${JWT_SECRET_KEY:a7f997cb3734907e6ce00508c77996e02d5b81215f9993d061198404fa41a343}}
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  mail:
    from: ${MAIL_FROM:noreply@dypiu.edu.in}
